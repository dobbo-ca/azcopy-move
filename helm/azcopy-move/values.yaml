# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/dobbo-ca/containers/azcopy-move
  # Empty in git. The chart release job writes the image semver in with
  # `yq -i '.image.tag = ...'` immediately before `helm package`, so the
  # packaged chart always pins an immutable tag. Never set this to "latest".
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
  # - name: secret-registry

# ---------------------------------------------------------------------------
# Schedule
# ---------------------------------------------------------------------------
schedule: "*/5 * * * *"

# Forbid means a run is skipped while the previous one is still going, so two
# copies never touch the same files. Do not change this to Allow.
concurrencyPolicy: Forbid

# A run that has not started within this many seconds is counted as missed.
startingDeadlineSeconds: 120

# Hard ceiling on one run. With Forbid, a run that hangs blocks every later
# one, so this is what breaks the deadlock.
activeDeadlineSeconds: 3600

# 0 means one attempt per run. The next scheduled run is the retry.
backoffLimit: 0

successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 5

suspend: false

# ---------------------------------------------------------------------------
# What to move
# ---------------------------------------------------------------------------
# Source and destination are independent, so Blob->File, Blob->Blob, File->Blob
# and File->File all work, across two different storage accounts.
move:
  source:
    type: blob            # blob | file
    storageAccount: ""    # ignored when endpoint is set
    endpoint: ""           # full scheme+host override, no path, e.g.
                            # https://acct.privatelink.blob.core.windows.net
    container: ""          # container name (blob) or share name (file)
    prefix: ""             # empty means the container root
  dest:
    type: file
    storageAccount: ""
    endpoint: ""
    container: ""
    prefix: ""

# ---------------------------------------------------------------------------
# Deletion
# ---------------------------------------------------------------------------
cleanup:
  # SAFE DEFAULT. false runs the copy and writes the delete report, but
  # deletes nothing. Watch a few cycles, read the reports, then set true.
  enabled: false

  # false requires the destination SAS and checks every file is at the
  # destination with a matching byte count before deleting it. Setting true
  # deletes on the azcopy job record alone.
  trustJobRecordOnly: false

  # Also delete any source file already at the destination with a matching
  # byte count, not only the ones this run's job reports.
  #
  # KEEP THIS ON. A file copied in one run but held back by a transient verify
  # failure never appears in a later job record, because the later copy skips
  # it as already present. Without reconcile it stays at the source forever.
  # It compares two listings already in memory, so it costs no API calls.
  reconcile: true

# ---------------------------------------------------------------------------
# azcopy tuning
# ---------------------------------------------------------------------------
azcopy:
  # How many HTTP connections azcopy uses. EMPTY (the default) leaves it to
  # azcopy, which sizes it from the pod's logical cores.
  #
  # This is a server-to-server copy, so the ceiling is the storage account, not
  # the pod -- and an Azure FILES destination throttles far earlier than Blob.
  # A standard file share is around 1,000 IOPS, and every large file is written
  # as a stream of 4 MB "PUT ?comp=range" calls, so a high value here becomes a
  # flood of range writes against one share.
  #
  # Measured, moving 845 files (~1.7 GB each) from a blob container to a file
  # share on one account: concurrencyValue 400 produced 202,725 HTTP 503
  # ServerBusy responses, every one of them from the FILE destination and none
  # from the blob source. Retries reached six attempts deep. The copy still
  # completed with zero failures, but it wasted enormous effort and hammered an
  # account that was also serving live traffic.
  #
  # Start empty. If throughput is genuinely limited, raise in steps and watch
  # the pod log for 503 ServerBusy. For a Files destination, treat something
  # like 64 as a ceiling rather than a starting point.
  concurrencyValue: ""

  # How many FILES azcopy transfers at once, as opposed to how many connections
  # it opens. Empty leaves it to azcopy. With large files this is often the more
  # effective lever, because it bounds concurrent range writes per share without
  # starving a single transfer of connections.
  concurrentFiles: ""
  logLevel: ERROR
  overwrite: ifSourceNewer
  trailingDot: Enable
  extraArgs: []

  # Seconds between progress lines in the pod log.
  #
  # azcopy redraws one status line with a carriage return, which is right for a
  # terminal and unreadable anywhere else: with no TTY the whole run becomes a
  # single unbounded line, so `kubectl logs` shows a wall of text and
  # `kubectl logs -f` looks like it has hung. The scripts convert those returns
  # to real newlines, which then yields an update roughly every two seconds --
  # about 2500 lines on an 85 minute run -- so they are thinned to one per
  # interval here.
  #
  # copy.log inside the pod always keeps every line; this only affects stdout.
  # Set 0 to print every update.
  progressIntervalSeconds: 30

# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
# Authorization is by SAS only. No workload identity, no OIDC.
#
# Strongly preferred: create the Secret out of band so no SAS ever reaches
# git or a Helm release. Both keys are required unless
# cleanup.trustJobRecordOnly is true.
#
#   kubectl create secret generic azcopy-move-sas -n azcopy-move \
#     --from-literal=source-sas='sv=...' \
#     --from-literal=dest-sas='sv=...'
#
sas:
  existingSecret: azcopy-move-sas
  sourceKey: source-sas
  destKey: dest-sas

  # Only for a throwaway test. Setting these writes the SAS into the release.
  create: false
  sourceSas: ""
  destSas: ""

# ---------------------------------------------------------------------------
# Pod
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""

# Satisfies the Kyverno restricted profile. Change nothing here without
# checking the cluster policies first.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Scratch space for job plan files, logs and the delete list. One emptyDir per
# run, so each run only ever sees its own azcopy job.
workDir:
  sizeLimit: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Ad-hoc delete
# ---------------------------------------------------------------------------
# A one-shot Job that deletes source objects named in a ConfigMap, for the case
# where a copy ran with cleanup disabled: the objects arrived, nothing removed
# them, and the azcopy job plan that recorded the transfer died with the pod's
# emptyDir. Feed it that run's delete-list.txt (or delete-report.csv) instead.
#
# It runs the same remove-migrated.sh as the schedule. The list supplies
# CANDIDATES, not decisions -- every path is still checked against a live
# destination listing and a byte comparison before anything is removed, so a
# stale or wrong list cannot delete an object that is not provably at the
# destination.
adhocDelete:
  enabled: false

  # SAFE DEFAULT, and deliberately separate from cleanup.enabled: arming the
  # schedule's deletion must not silently arm a one-shot bulk delete. false
  # reports and runs azcopy rm --dry-run.
  cleanupEnabled: false

  # ConfigMap holding the list. Create it out of band from the captured file:
  #
  #   kubectl create configmap azcopy-move-reap -n <ns> \
  #     --from-file=delete-list.txt=./delete-list.txt
  #
  # A ConfigMap caps at 1 MiB, which is roughly 20,000 paths. Split the list if
  # it is larger.
  listConfigMap: ""
  listKey: delete-list.txt

  activeDeadlineSeconds: 14400
