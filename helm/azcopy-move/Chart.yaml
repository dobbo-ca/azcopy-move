apiVersion: v2
name: azcopy-move
description: Move a storage prefix between Azure Blob and Azure Files on a schedule, verify what arrived, then delete only the verified source objects.
type: application
# Placeholder. CI overwrites this with `helm package --version` from the
# chart/v* semver-bump tag; nobody edits it by hand.
version: 0.1.0
# The azcopy version baked into the image, read from the Dockerfile ARG. This
# is the conventional meaning of appVersion; it does not name the image.
appVersion: "10.32.6"
keywords:
  - azcopy
  - azure-storage
  - migration
# home and sources are what attach the OCI chart package to this repository, so
# its package page carries the README instead of being a blank orphan. They are
# the chart-side equivalent of org.opencontainers.image.source on the image.
home: https://github.com/dobbo-ca/azcopy-move
sources:
  - https://github.com/dobbo-ca/azcopy-move
maintainers:
  - name: Chris Dobbyn
    url: https://github.com/dobbo-ca
