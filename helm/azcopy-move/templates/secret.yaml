{{- if .Values.sas.create }}
{{- /*
  Only for a throwaway test. This writes the SAS into the Helm release, which
  is stored in the cluster and often in git. Prefer sas.existingSecret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "azcopy-move.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azcopy-move.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.sas.sourceKey }}: {{ required "sas.sourceSas is required when sas.create is true" .Values.sas.sourceSas | quote }}
  {{- if .Values.sas.destSas }}
  {{ .Values.sas.destKey }}: {{ .Values.sas.destSas | quote }}
  {{- end }}
{{- end }}
