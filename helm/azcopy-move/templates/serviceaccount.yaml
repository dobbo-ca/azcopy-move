{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "azcopy-move.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azcopy-move.labels" . | nindent 4 }}
# The pod never calls the Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
