apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "azcopy-move.fullname" . }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azcopy-move.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "scripts/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
