# git-cliff config for the image/v* version line. Identical to
# .cliff-chart.toml except the prefix, include path and initial tag — see
# that file's header comment for the reasoning.
#
# NOTE: [changelog] below (header/body/commit_parsers) is only ever consumed
# via `--bumped-version`, which ignores it entirely — release.yml has no step
# that renders a changelog or creates a GitHub Release from this config. It's
# kept ready for whenever that's added; until then this repo publishes no
# release notes, by omission rather than by intent to skip them.
[changelog]
header = "# Image Changelog\n\n"
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for c in commits %}- {{ c.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = '^image/v[0-9]+\.[0-9]+\.[0-9]+$'
include_paths = ["containers/**"]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(docs|test|ci|chore|refactor|style|perf)", group = "Other" },
]

[bump]
initial_tag = "image/v0.1.0"
